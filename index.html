<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<title>PMD: Dojo Battles</title>
<style>
  /* nothing on the page scrolls, zooms or selects under a thumb */
  html, body {
    height: 100%; margin: 0; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage canvas { image-rendering: pixelated; outline: none; }
</style>
</head>

<div id="stage"></div>
<script type="module" src="/src/client/main.js"></script>
</body>
